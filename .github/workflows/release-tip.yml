# Fastty tip: every push to main ships a macOS build to the rolling `tip`
# GitHub pre-release, plus a Sparkle appcast.xml next to it.
# Trimmed from Ghostty's release-tip.yml (macOS job only).
# Codesign/notarize steps run only when their secrets exist; otherwise the
# app is ad-hoc signed.
on:
  push:
    branches: [main]
  workflow_dispatch:

name: Release Tip

# One release at a time so the tip assets never get corrupted.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP: macos/build/Release/Fastty.app
      GH_TOKEN: ${{ github.token }}
      HAS_CERT: ${{ secrets.PROD_MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.PROD_MACOS_CERTIFICATE != '' && secrets.APPLE_NOTARIZATION_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Important so that build number generation works
          fetch-depth: 0

      - name: Extract build info
        run: |
          echo "GHOSTTY_BUILD=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "GHOSTTY_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GHOSTTY_COMMIT_LONG=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # TODO(tahoe): https://github.com/NixOS/nix/issues/13342
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      # ponytail: read-only use of Ghostty's public cache; own cachix if it misses a lot.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty

      - name: XCode Select
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Setup Sparkle
        env:
          SPARKLE_VERSION: 2.9.6
        run: |
          mkdir -p .action/sparkle
          cd .action/sparkle
          curl -fL https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip > sparkle.zip
          unzip -q sparkle.zip
          echo "$(pwd)/bin" >> $GITHUB_PATH

      # GhosttyKit is the framework that is built from Zig for our native
      # Mac app to access. Build this in release mode.
      - name: Build GhosttyKit
        run: nix develop -c zig build -Doptimize=ReleaseFast -Demit-macos-app=false

      # IMPORTANT: this must NOT run in a Nix environment.
      - name: Build Fastty.app
        run: |
          cd macos
          xcodebuild -target Ghostty -configuration Release

      - name: Update Info.plist
        env:
          SPARKLE_KEY_PUB: ${{ secrets.PROD_MACOS_SPARKLE_KEY_PUB }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :GhosttyCommit $GHOSTTY_COMMIT" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GHOSTTY_BUILD" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $GHOSTTY_COMMIT" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $SPARKLE_KEY_PUB" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$APP/Contents/Info.plist"

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          rm certificate.p12

      # Without a certificate the identity is "-" (ad-hoc).
      - name: Codesign app bundle
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME || '-' }}
        run: |
          S="/usr/bin/codesign --verbose -f -s $MACOS_CERTIFICATE_NAME -o runtime"
          F="$APP/Contents/Frameworks/Sparkle.framework"
          $S "$F/Versions/B/XPCServices/Downloader.xpc"
          $S "$F/Versions/B/XPCServices/Installer.xpc"
          $S "$F/Versions/B/Autoupdate"
          $S "$F/Versions/B/Updater.app"
          $S "$F"
          $S "$APP/Contents/PlugIns/DockTilePlugin.plugin"
          $S --entitlements macos/Ghostty.entitlements "$APP"

      - name: Create DMG
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
        run: |
          npm install --global create-dmg
          if [ "$HAS_CERT" = true ]; then SIGN="--identity=$MACOS_CERTIFICATE_NAME"; else SIGN="--no-code-sign"; fi
          create-dmg "$SIGN" "$APP" ./
          mv ./Fastty*.dmg ./Fastty.dmg

      - name: Notarize DMG
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        run: |
          echo "$APPLE_NOTARIZATION_KEY" > notarization_key.p8
          xcrun notarytool store-credentials "notarytool-profile" --key notarization_key.p8 --key-id "$APPLE_NOTARIZATION_KEY_ID" --issuer "$APPLE_NOTARIZATION_ISSUER"
          rm notarization_key.p8
          xcrun notarytool submit "Fastty.dmg" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple "Fastty.dmg"
          xcrun stapler staple "$APP"

      - name: Zip App
        run: |
          cd macos/build/Release
          zip -9 -q -r --symlinks ../../../fastty-macos-universal.zip Fastty.app

      - name: Generate Appcast
        env:
          SPARKLE_KEY: ${{ secrets.PROD_MACOS_SPARKLE_KEY }}
        run: |
          echo $SPARKLE_KEY > signing.key
          sign_update -f signing.key Fastty.dmg > sign_update.txt
          rm signing.key
          python3 ./dist/macos/update_appcast_tip.py
          test -f appcast_new.xml
          mv appcast_new.xml appcast.xml

      # Re-point the tip tag, then replace the assets. Binaries go up before
      # the appcast so the appcast never points at a missing/old DMG.
      - name: Release
        run: |
          git tag -f tip "$GITHUB_SHA"
          git push -f origin tip
          gh release view tip >/dev/null 2>&1 || gh release create tip --prerelease \
            --title 'Fastty Tip ("Nightly")' --notes "Automated build from the latest commit on main."
          gh release upload tip Fastty.dmg fastty-macos-universal.zip --clobber
          gh release upload tip appcast.xml --clobber
